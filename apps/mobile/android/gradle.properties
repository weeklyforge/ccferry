# The flutter-template defaults (8G heap / 4G metaspace) OOM-crashed the
# daemon on a 16G dev machine under load; 2G/1G builds reliably.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
# Incremental Kotlin caches fail to close on this machine (deep worktree
# paths + file locking); non-incremental compiles reliably and the app is
# small enough that the extra time is noise.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
